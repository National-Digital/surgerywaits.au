[project]
name = "surgerywaits-pipeline"
version = "0.1.0"
description = "Builds the surgerywaits.au data from publicdata.au's pinned versions."
requires-python = "==3.13.*"
license = "AGPL-3.0-or-later"
dependencies = ["jsonschema==4.26.0", "pyarrow==26.0.1", "referencing==0.37.0"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20261103",
  "ruff==0.17.4",
  "pyright==1.1.414",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surgerywaits"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Docstrings are optional; comments are one short line where a why is needed.
  "D",
  # Conflicts with ruff format, which owns trailing commas.
  "COM812",
  # Conflicts with ruff format, which owns joined strings.
  "ISC001",
  # No file carries a copyright header; the licence files cover the code.
  "CPY",
]

[tool.ruff.lint.per-file-ignores]
# pytest tests use assert.
"tests/**" = ["S101"]
# Hand-run scripts are not a package and report progress on stdout.
"scripts/**" = ["INP001", "T201"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "-W", "error"]
xfail_strict = true
