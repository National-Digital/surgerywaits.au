# A source quote that must keep a replaced term is listed in quotes, with the page slug and the reason.
terms:
  - preferred: planned surgery
    replaces:
      - elective surgery
      - elective
  - preferred: not published
    replaces:
      - suppressed
      - n/a
quotes:
  - page: methodology
    term: elective surgery
    reason: The methodology quotes the source's name for its collection and for three of its measures.
  - page: methodology
    term: elective
    reason: The methodology explains the source's word, and quotes it in the measure names.
