title: 'Guide for people building agents: {site}'
description: Which files an agent should read on Surgery Waits, their licences, the content signal in robots.txt, how the site serves and caches files, and how to cite a figure.
crumb_home: Home
crumb: For agents
heading: Guide for people building agents
lede: This page names the files an agent can read on Surgery Waits and the terms under which it can use them. Each page and file that this page names by its address exists on the site. A folder that it names, such as /data-api/, holds files and has no page of its own.
sections:
  - id: files
    heading: Which files to read
    paragraphs:
      - 'Read /llms.txt first. It groups its links under these headings: {llms_headings}.'
    items:
      - /llms-full.txt holds the text of the about, methodology and data pages and the credit for each dataset in one plain-text file.
      - The folder /data-api/ holds the figures behind the pages as JSON files. The file /data-api/index.json gives the counts and the scope of the data.
      - The file /data-api/openapi.json is an OpenAPI 3.1 description of the data files, which lists each path with its parameters, responses and headers.
      - The folder /contract/ holds JSON Schema files. Each file under /data-api/ except /data-api/openapi.json follows its schema in /contract/, and /data-api/openapi.json follows the OpenAPI 3.1 schema.
      - The folder /charts/ holds an SVG chart of the median wait in each state for each procedure that has a state figure.
      - The file /sitemap.xml is a sitemap index that links the sitemap files.
      - 'The files {catalog_paths} hold one catalog of the entries {catalog_names}, each with an address, a type, a description and example questions. Both files have the same content.'
    links:
      - label: Data and attribution
        href: /data/
      - label: Methodology
        href: /methodology/
  - id: licences
    heading: Licences
    paragraphs:
      - Each dataset keeps its publisher's licence. Every file under /data-api/ lists its sources in a sources entry, except /data-api/openapi.json and /data-api/rules.json. The file /data-api/credits.json gives the publisher, licence, version and citation for each source.
      - A person who reuses a file credits the publisher it names, under the licence it names. The publishers do not endorse this site and have no involvement in it.
  - id: signal
    heading: The content signal in robots.txt
    paragraphs:
      - 'The file /robots.txt carries the line "{content_signal}" in each of its groups. It sets {signal_values}. The file has one group for all other crawlers (User-agent: *) and one group for each of these named crawlers: {crawlers}.'
      - Every group allows every path, and the file has no Disallow line. A comment at the top of the file points to this page and to /llms.txt.
  - id: serving
    heading: Methods and cache headers
    paragraphs:
      - 'The site answers GET and HEAD requests on every path except {mcp_path} and {mcp_path}/. It also answers OPTIONS requests under /data-api/ for a browser that asks before a cross-origin read. The route {mcp_path} answers POST and OPTIONS requests, and its server card at {mcp_card} answers OPTIONS requests. On every other path, any other method receives status 405.'
      - 'Files under /data-api/ carry the header Cache-Control: {data_cache}, so a client may keep a file for an hour. They also carry Access-Control-Allow-Origin: {cors_origin}, so a web page on any site may read them. A missing data file returns status 404 with a JSON body.'
      - 'Pages carry the header Cache-Control: {page_cache}, and /robots.txt carries Cache-Control: {robots_cache}.'
  - id: markdown
    heading: Markdown versions of pages
    paragraphs:
      - 'Each page has a Markdown version. Its address is the page address with the closing slash replaced by {twin_extension}. The page /hospitals/ has the version {twin_example}, and the home page / has the version {twin_home}. A version starts with the line "Canonical URL:" and the address of the page, and then gives the content of the main part of the page.'
      - 'The Worker returns the Markdown version at the page address itself when a GET or HEAD request sends an Accept header that prefers text/markdown to text/html. That answer carries Content-Type: {twin_type}, Vary: Accept and a Content-Location header that names the version. A request that prefers HTML receives the page, and the page carries Vary: Accept and a Link header that names its Markdown version with rel="alternate" and type="text/markdown".'
      - 'A request for a page address other than / followed by index.md or by index.html.md receives status {twin_redirect} and a Location header that names the Markdown version. A request for /index.html.md receives the same status, and a request for /index.md returns the home version. A Markdown version carries a Link header with rel="canonical" that gives the full address of its page on {twin_canonical_host}. A version that does not exist at an address outside /data-api/ returns status 404 with a Markdown body.'
  - id: mcp
    heading: The MCP server
    paragraphs:
      - 'The Worker serves a Model Context Protocol server at {mcp_path}. Its server card is at {mcp_card}. The server answers these protocol revisions: {mcp_versions}.'
      - 'The server has these {mcp_access} tools: {mcp_tools}. They read the data files that this site publishes.'
      - 'The route {mcp_path} takes POST requests for JSON-RPC and OPTIONS requests for a browser that asks before a cross-origin call. A request from a browser is accepted when its Origin is one of {mcp_origins}, or the origin of the address it calls. Any other Origin receives status 403 with every method. The route treats a request with no Origin header as one that does not come from a browser, and accepts it. A request with an accepted Origin or no Origin that uses any other method receives status 405.'
  - id: cite
    heading: How to cite
    paragraphs:
      - Link the page or file that you used, and name {site} as the place that you read the figure.
      - Credit the publisher that the file names, under the licence it names, and use the citation in /data-api/credits.json. Give the reference period and the release date that the page or file states with each figure.
      - A figure has the state not_published when the publisher gives a code or a withheld mark instead of a number, and the state not_reported when the source leaves it empty and gives neither a publisher code nor a withheld mark. Each has a reason and no value. Report the first as not published and the second as not reported. Neither is ever a zero, and neither has a rank.
examples_heading: Example addresses
examples_intro: Each address below is a file or page on this site.
