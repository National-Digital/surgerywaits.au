  - path: /data/
    note: The datasets, with their licences and citations.
llms:
  summary: Surgery Waits shows how long patients waited for planned surgery at public hospitals in Australia, by hospital, surgery, state and urgency category. Every figure comes from a dataset that publicdata.au serves, and /data-api/credits.json names each one.
  full_summary: This file holds the text of the about, methodology and data pages, and the credit for each dataset, in plain text.
  heading_pages: Key pages
  heading_guides: Guides
  heading_about: About, data and agents
  heading_data: Data files
  heading_schemas: Schemas
  heading_site: Crawling and plain text
  notes:
    data-files.index: The counts and the scope of the data.
    data-files.credits: The publisher, licence, version and citation of each source.
    data-files.rules: The rules that the site applies to the data.
    data-files.surgeries: Each surgery category that has a page, with its slug.
    data-files.hospitals: Each hospital that has a page, with its slug.
    data-files.health-services: Each health service that has a page, with its slug.
    openapi: The OpenAPI 3.1 description of the data files.
    sitemaps: The sitemap index, which links the sitemap files.
    mcp-server-card: The card for the MCP server at /mcp, served by the Worker.
    robots: The crawl rules and the content signals.
    agent-catalog: The catalog of the files and the server that an agent can read. The file at /.well-known/ard.json has the same content.
    llms-full: The text of the about, methodology and data pages and the credits.
catalog:
  entries:
    llms:
      name: '{site} llms.txt'
      description: A short plain-text guide to the site for language models. It states the scope and limits of the site and lists the addresses of its pages and data files.
      queries:
        - Which pages and files on Surgery Waits should an agent read first?
        - What does Surgery Waits cover, and what does it leave out?
    openapi:
      name: '{site} data API'
      description: The files of published public hospital waiting times for planned surgery in Australia, described in OpenAPI 3.1.
      queries:
        - What is the median wait for a planned surgery at public hospitals in a state?
        - What does urgency category 2 mean for planned surgery in Australia?
        - How many people waited more than a year for planned surgery at a public hospital?
    mcp-server-card:
      name: '{site} MCP server'
      description: 'Tools over the published planned surgery waiting times at Australian public hospitals. The tools are {mcp_access}.'
      queries:
        - Which public hospitals near an Australian suburb have the shortest median wait for a surgery?
        - What does urgency category 2 mean for planned surgery in Australia?
