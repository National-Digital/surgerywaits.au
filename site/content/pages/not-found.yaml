heading: Page not found
paragraphs:
  - This page does not exist.
  - This site shows the waiting times that public hospitals reported for planned surgery in Australia. The site has pages for hospitals and surgeries, and pages that compare states and urgency categories.
  - The methodology page explains how the site works, and the data page names each source.
  - The Australian Institute of Health and Welfare supplies most of the figures, and each page of figures states the date its data was released.
