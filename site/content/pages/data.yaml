title: 'Data and attribution: where {site} gets its data'
description: Every dataset behind Surgery Waits, with its publisher, version, release date, licence and citation, and how to reuse the data.
crumb_home: Home
crumb: Data and attribution
heading: Data and attribution
lede: Every figure on this site comes from one of the datasets listed below. The site takes each dataset from publicdata.au.
stamp: 'The national waiting times on this site cover {period} and were released on {release}.'
counts: 'The register lists {hospitals} public hospitals, and the site covers {surgeries} surgeries and specialties.'
sections:
  - id: how
    heading: How the build reads the data
    paragraphs:
      - 'publicdata.au serves each dataset as a dated version that does not change. The build pins one version of each dataset and records its SHA-256 digest. The build stops when a downloaded file has a different digest.'
      - The build has no other source and no fallback. It does not fetch from the publishers directly.
    links:
      - label: Methodology
        href: /methodology/
  - id: use
    heading: What each dataset supplies
    paragraphs:
      - The Australian Institute of Health and Welfare (AIHW) supplies three tables of waiting times, one for urgency categories, one for procedures and one for specialties. It also supplies the register of hospitals with their names, states, health networks and locations, and the lists of measures and reporting units that describe them.
      - Queensland Health supplies quarterly figures by urgency category and by specialty. The Australian Bureau of Statistics supplies the suburb and locality boundaries that give each suburb a centre.
after:
  - id: files
    heading: The data files
    paragraphs:
      - The site publishes the data behind its pages as JSON files under /data-api/. The build writes each file from the dataset files that publicdata.au serves.
      - Each file has its keys in alphabetical order. Any web page on any site may read the files, and a browser may keep a file for an hour. The published files hold the same content as the build's source files. A number such as 5.0 appears as 5.
      - Every file except /data-api/rules.json lists its sources in a sources entry. The file /data-api/credits.json gives the publisher, licence, version and citation for each source. A person who reuses a file credits the publisher it names, under the licence it names.
      - The file /data-api/rules.json holds the rules the site applies to the data. It gives the number of neighbouring hospitals in a comparison and the starting search radius in kilometres. It gives the longest age of a reference period and the longest gap in days between a Queensland quarter and its release. It gives the number of facilities matched to the register by hand. It names each measure. For each measure with a better direction, it says whether a lower value is better. It also lists the publisher codes for a withheld figure, with the reason each code stands for.
      - A figure that a publisher withholds has a state of not_published or not_reported and a reason, and it has no value. A withheld figure is never a zero. Every published figure states its reference period and its release date.
      - The file /data-api/index.json gives the counts and the scope of the data. The files /data-api/surgeries.json, /data-api/hospitals.json and /data-api/health-services.json list every surgery, hospital and health service with its slug.
      - Each of those lists has its own files in a folder of the same name, and the surgeries are in a folder for each kind. The state benchmarks are in /data-api/states/, with one file for each state that has figures.
      - Each hospital's yearly trend has its own file in /data-api/trends/.
      - The Queensland quarterly figures are in /data-api/queensland.json and in /data-api/queensland/, with one file for each hospital that has quarterly figures.
      - The file /data-api/suburbs.json holds the centre point of each suburb.
      - A JSON Schema for each kind of file is published at /contract/, named for the kind, as in /contract/hospital.schema.json. The build checks every published file against its schema.
      - A chart of the median wait in each state for one procedure is published as an SVG file at /charts/, with the name of the procedure's page address and the ending .svg. Every state in the procedure's benchmark file appears in the chart. A state with a withheld figure, or with no figure, has a row that says why and has no bar.
  - id: reuse
    heading: Reusing the data
    paragraphs:
      - Each dataset keeps its publisher's licence, which its entry above names. These licences require a person who reuses the data to credit the publisher. The entry gives a citation to use.
      - The publishers do not endorse this site and have no involvement in it. The site excludes private hospitals.
  - id: typeface
    heading: Typeface
    paragraphs:
      - The site sets its headings and figures in Newsreader, a typeface that is copyright 2020 The Newsreader Project Authors and is licensed under the SIL Open Font License, Version 1.1.
