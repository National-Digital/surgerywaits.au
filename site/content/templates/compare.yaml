title: 'Compare planned surgery waiting times near you: {site}'
description: 'Choose a surgery and a place to see the public hospitals nearest to that place and their median waits for the surgery. The latest figures cover {period}.'
heading: Compare waiting times near you
lede: 'Choose a surgery and a place. The page lists the public hospitals nearest to that place that report the surgery, with the median wait at each. The latest figures cover {period}.'
form_heading: Choose a surgery and a place
fallback_heading: Find the same figures without scripts
fallback_intro: This search needs scripts, and scripts are switched off or have not loaded. The pages below hold the same figures and need no script.
fallback_surgery_name: Surgery
fallback_surgery_note: Each surgery page lists every hospital that reports it, by state, with the shortest median wait first.
fallback_hospitals_name: Public hospitals
fallback_hospitals_note: Each hospital page shows its figures for every surgery it reports and the hospitals near it.
fallback_states_name: States and territories
fallback_states_note: Each state and territory page ranks its public hospitals by median wait.
load_failed: The search data did not load. Reload the page to try again, or use the pages above.
privacy_heading: What this page keeps
privacy: Nothing you type on this page is stored on your device, added to the address or sent anywhere. The search runs in your browser against one data file from this site.
distance_note: The distance on this page is measured in a straight line between two points on the map. A road journey is longer than that, and this page gives no travel time.
tool:
