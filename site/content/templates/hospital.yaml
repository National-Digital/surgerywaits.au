procedures_heading: Waiting times by procedure
procedures_intro: The shortest median wait comes first. A procedure with no published figure follows, in name order.
procedures_caption: 'Planned surgery procedures at {hospital}'
procedures_row_heading: Procedure
specialties_heading: Waiting times by specialty
specialties_intro: The shortest median wait comes first. A specialty with no published figure follows, in name order.
specialties_caption: 'Planned surgery specialties at {hospital}'
specialties_row_heading: Specialty
trends_heading: How waits have changed
trends_intro: Each chart shows one figure for each year the source published it. A year with no published figure is a gap in the line, and the table under the chart gives the reason.
chart_median_caption: 'Median wait at {hospital}, by urgency category'
chart_median_name: 'Line chart of the median wait at {hospital} for each urgency category'
chart_on_time_caption: 'Share treated within the recommended time at {hospital}, by urgency category'
chart_on_time_name: 'Line chart of the share treated within the recommended time at {hospital} for each urgency category'
qld_heading: Queensland Health quarterly figures
qld_intro: 'Queensland Health also publishes figures for {hospital} each quarter. They come from a different source, so this page keeps them apart from the national figures. It does not rank them or compare them with other hospitals.'
qld_quarter: 'All planned surgery, {quarter}'
nearby_heading: Hospitals nearby
nearby_heading_closed: Open hospitals nearby
nearby_intro: 'These are the open public hospitals nearest {hospital}, nearest first. Each distance is a straight line, not a travel time.'
nearby_distance: '{distance} away'
nearby_none: 'The source gives no location for {hospital}, so this page cannot list hospitals near it.'
exclusion_heading: What this page leaves out
exclusion: Private hospitals are excluded. This page covers public hospitals only, so it shows no private hospital.
ranking: A rank compares this hospital with the other public hospitals that published the same figure for the same period. The page shows a rank only on a current published figure. It never ranks a figure that is withheld, not reported or from an earlier period.
