urgency_heading: Waiting times by urgency category
urgency_intro: Each tile shows one measure for all planned surgery at this hospital in one urgency category.
urgency_note: Your treating specialist gives you an urgency category. You do not choose it. Surgery in category 1 is recommended within 30 days, category 2 within 90 days and category 3 within 365 days.
