column_difference: Difference
method_heading: How this is calculated
method:
  - Both hospitals published a median wait for the same surgery in the period. Only published figures enter the calculation.
  - The two hospitals are in different states and lie within the stated distance, measured in a straight line between their recorded locations. The distance is approximate and is not a road distance.
  - The difference describes two published medians only. A person's own wait depends on their case, and this page does not recommend travel.
  - Each hospital appears once for each surgery, against the hospital across the border with the largest difference.
