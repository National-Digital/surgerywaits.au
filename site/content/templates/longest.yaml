reading_heading: How to read these figures
reading:
  - A median wait describes surgery that already happened. It does not judge a hospital, because case mix, size and demand differ between hospitals.
  - This site calls no hospital best or worst. A figure that is not published never counts as a number.
exclusion_heading: What these figures leave out
exclusion: Private hospitals are excluded. These pages cover public hospitals only, so they show no private hospital. They also leave out closed hospitals and any figure that is not published.
companions_heading: Related pages
companions_intro: Each page below shows the same published medians from a different angle.
