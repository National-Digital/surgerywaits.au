index_title: 'Planned surgery waiting times by state and territory: {site}'
index_description: This page links to the planned surgery waiting times at public hospitals in each Australian state and territory. The national figures sit beside them.
index_heading: Waiting times by state and territory
index_lede: Each state and territory page shows its waiting times for each surgery beside the national figures. It also ranks the public hospitals of that state or territory by median wait.
index_stamp: 'The figures are for {period}. The data was released on {release}.'
index_list_label: States and territories
index_hospitals_one: 1 public hospital
