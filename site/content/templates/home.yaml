about_heading: What this site does
about:
  - Public hospitals across Australia report how long people waited for planned surgery. The figures are published once a year, hospital by hospital and surgery by surgery. This site lays them out so that you can compare the hospitals near you.
  - Every number on this site is a published government figure. Each figure shows the period it covers and the date it was released. The site does not estimate a figure, and it does not accept payment to change one. A table orders hospitals by a measured number, and the site does not call any hospital the best.
  - A median wait is the number of days within which half of the surgeries took place. A median wait describes past surgeries and does not predict your own wait.
exclusion_heading: What this site leaves out
exclusion: Private hospitals are excluded. This site covers public hospitals only, so it shows no private hospital.
