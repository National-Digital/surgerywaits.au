urgency_heading: Waiting times by urgency category
urgency_intro: Your treating specialist gives you an urgency category. Each category page ranks public hospitals by the share of patients treated within the recommended time.
about_heading: About these figures
about:
  - Every figure on this site comes from published government data. The site does not estimate a figure, and it does not accept payment to change one.
  - A table orders hospitals by a measured number. The site does not call any hospital the best.
  - A median wait is the number of days within which half of the patients were treated. A median wait describes past patients and does not predict your own wait.
exclusion_heading: What this site leaves out
exclusion: Private hospitals are excluded. This site covers public hospitals only, so it shows no private hospital.
