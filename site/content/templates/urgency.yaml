categories:
  - short: urgent
    within: 30 days
    meaning: It is for a condition that could get worse quickly enough to become an emergency.
  - short: semi-urgent
    within: 90 days
    meaning: It is for a condition that causes some pain, dysfunction or disability. The condition is unlikely to get worse quickly or become an emergency.
  - short: non-urgent
    within: 365 days
    meaning: It is for a condition that causes little or no pain, dysfunction or disability. The condition is unlikely to get worse quickly and is not expected to become an emergency.
crumb_home: Home
crumb_urgency: Urgency categories
category_label: 'Category {number}, {short}'
index_title: 'Urgency categories for planned surgery: {site}'
index_description: What urgency categories 1, 2 and 3 mean for planned surgery in an Australian public hospital, the recommended time for each, and how often each public hospital meets it.
index_heading: Urgency categories explained
index_lede: What categories 1, 2 and 3 mean, who decides yours, and how often each public hospital treats people within the recommended time.
index_stamp: 'The figures are for {period}. The data was released on {release}.'
index_intro: When you join a public hospital waiting list for planned surgery, your treating specialist gives you an urgency category. The specialist assigns it after assessing you. It is a clinical judgement about how soon your surgery should happen. You do not choose it, and this site cannot work it out for you.
categories_heading: The three categories
categories_intro: The recommended time is a target. Each hospital reports how many people it treated within that time. This site shows that share hospital by hospital, with the highest share first.
category_within: 'Surgery is recommended within {within}.'
category_hospitals_one: 1 public hospital published a share treated on time.
category_hospitals_many: '{count} public hospitals published a share treated on time.'
states_heading: By state and territory
states_intro: Each link opens the public hospitals of one state or territory for one category.
state_link: '{state}: {category}'
relation_heading: How categories relate to waiting times by surgery
relation:
  - The waiting time for a surgery, such as a hip replacement, covers everyone who had that surgery in all three categories together. A hospital page shows the surgery figures and the urgency figures separately, because the publisher does not report a figure for one surgery in one category.
  - A hospital with a short median wait for your surgery may be slower or faster for your category. Take both numbers to your appointment.
ask_heading: What to ask your specialist
ask:
  - What urgency category am I likely to be, and why?
  - What is the recommended time for that category, and how often does this hospital meet it?
  - Does my category change if my condition changes while I wait?
