grouping_heading: How hospitals are grouped
grouping:
  - The source assigns each public hospital to a local hospital network. Each state and territory has its own name for these networks. They are local health districts in New South Wales, hospital and health services in Queensland, and health services in Victoria and Western Australia.
  - This site shows the source's grouping as published and does not change it.
