name: Deploy

# Builds the site from the pinned publicdata.au versions, runs the built-page gates, then deploys
# the Worker with its assets. It runs when CI finishes successfully for a push to main, and builds
# main's commit, which must be the one that run passed. A manual run from main can deploy production or the staging Worker, which marks
# every response noindex. Either way the commit must be the tip of main and have passed CI. The Cloudflare secrets sit in the
# production environment and reach one step of the deploy job. The Worker's routes are not in the
# repository: they are set in the Cloudflare dashboard.
# The condition on each job accepts only a successful CI run of a push to main, or a manual run.
on: # zizmor: ignore[dangerous-triggers] runs only the trusted main commit that CI passed, from no fork or pull request
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        options: [production, staging]
        default: production

permissions: {}

# One deploy at a time, and a deploy that has started is never cancelled part way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    if: ${{ github.repository == 'National-Digital/surgerywaits.au' && github.ref == 'refs/heads/main' && contains(fromJSON('["workflow_dispatch:::", "workflow_run:push:success:main"]'), format('{0}:{1}:{2}:{3}', github.event_name, github.event.workflow_run.event, github.event.workflow_run.conclusion, github.event.workflow_run.head_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read # reads whether CI passed for the commit
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist
      SURGERYWAITS_REQUIRE_DATA: '1'
    steps:
      # A run for an older commit, or for a commit whose CI did not pass, deploys nothing.
      - name: Check the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          [ "$CI_SHA" = "$SHA" ] || { echo "::error::CI ran on a different commit from the one this run would build"; exit 1; }
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$tip" = "$SHA" ] || { echo "::error::A newer commit is on main, and its own run deploys it"; exit 1; }
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --event push --status success --json databaseId --jq length)
          [ "$passed" -gt 0 ] || { echo "::error::CI has not passed for this commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          enable-cache: false
      - run: uv sync --locked
        working-directory: pipeline
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The site's unit tests read the small fixture dist, as in CI.
      - run: uv run --locked python tests/fixture_dist.py "$RUNNER_TEMP/fixture-dist"
        working-directory: pipeline
      - run: npm test
        env:
          SURGERYWAITS_DIST: ${{ runner.temp }}/fixture-dist
      # The pull verifies every sha256 against data/manifest.json and fails on a mismatch.
      - run: uv run python -m surgerywaits.pull
        working-directory: pipeline
      - run: uv run --locked pytest -rs
        working-directory: pipeline
      - run: uv run python -m surgerywaits.build
        working-directory: pipeline
      - run: npm run build
      - run: npx vitest run site/src/contracts/built-pages.test.ts site/src/contracts/sitemaps.test.ts site/src/contracts/redirects.test.ts site/src/contracts/data-api.test.ts site/src/contracts/surfaces.test.ts site/src/contracts/json-ld.test.ts site/src/contracts/mcp-built.test.ts
        env:
          BUILT_PAGES: '1'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run html -- site/dist
      - run: npm run links -- site/dist
      - run: npm run weight -- site/dist
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run scripts/tool.test.ts -t "prints one sheet"
        env:
          TOOL_TEST: '1'
      - run: npx vitest run site/src/contracts/determinism.test.ts
        env:
          BUILD_TWICE: '1'
      - run: npm run worker:types:check
      - run: npm run worker:dry-run -- "$RUNNER_TEMP/worker-out"
      # The deploy job uploads exactly what the gates ran on. Dot files carry the security file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy the Worker
    needs: build
    if: ${{ github.repository == 'National-Digital/surgerywaits.au' && github.ref == 'refs/heads/main' && contains(fromJSON('["workflow_dispatch:::", "workflow_run:push:success:main"]'), format('{0}:{1}:{2}:{3}', github.event_name, github.event.workflow_run.event, github.event.workflow_run.conclusion, github.event.workflow_run.head_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # The build takes a while, so the deploy checks again that no newer commit reached main.
      - name: Check the commit is still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$tip" = "$SHA" ] || { echo "::error::A newer commit is on main, and its own run deploys it"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      # Only this step sees the Cloudflare credentials. A push always deploys production.
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
        run: |
          set -eu
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Deploys run from main only"; exit 1; }
          case "$TARGET" in
            production) npx wrangler deploy --env="" --config worker/wrangler.jsonc ;;
            staging) npx wrangler deploy --config worker/wrangler.jsonc --env staging ;;
            *) echo "::error::Unknown deploy target"; exit 1 ;;
          esac
