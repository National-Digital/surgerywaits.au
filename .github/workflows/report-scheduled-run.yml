name: Report scheduled run

# Reusable. Keeps one open issue per failing scheduled job: opened or commented on at each
# failure, closed at the next success.
on:
  workflow_call:
    inputs:
      title:
        description: Issue title used when a new issue is opened
        required: true
        type: string
      label:
        description: Label that identifies the job's issue
        required: true
        type: string
      result:
        description: failure, success, or anything else to leave the issue alone
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: report-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  report:
    name: Report
    if: github.repository == 'National-Digital/surgerywaits.au'
    runs-on: ubuntu-24.04
    permissions:
      issues: write # opens, comments on and closes the job's issue
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          LABEL: ${{ inputs.label }}
          RESULT: ${{ inputs.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          n=$(gh issue list --label "$LABEL" --author app/github-actions --search "in:title \"$TITLE\"" --state open --limit 1 --json number --jq '.[0].number // empty')
          case "$RESULT" in
            failure)
              printf 'The scheduled run failed: %s\n' "$RUN" > body.md
              if [ -n "$n" ]; then
                gh issue comment "$n" --body-file body.md
              else
                gh label create "$LABEL" --description "Scheduled run failing" --color d93f0b --force
                gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md
              fi
              ;;
            success)
              if [ -n "$n" ]; then
                gh issue close "$n" --comment "The scheduled run passed: $RUN"
              fi
              ;;
          esac
