name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
        working-directory: pipeline
      # The same small dist, built from the pipeline's fixtures, feeds the site's tests and preview.
      - run: uv run --locked python tests/fixture_dist.py "$SURGERYWAITS_DIST"
        working-directory: pipeline
      - run: npm test

  worker:
    name: Worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
        working-directory: pipeline
      # The site reads a dist at build time, so the fixture dist is built before the site.
      - run: uv run --locked python tests/fixture_dist.py "$SURGERYWAITS_DIST"
        working-directory: pipeline
      - run: npm run build
      - run: npx vitest run site/src/styles/built-css.test.ts
        env:
          BUILT_CSS: '1'
      - run: npx vitest run site/src/contracts/built-pages.test.ts site/src/contracts/sitemaps.test.ts site/src/contracts/redirects.test.ts
        env:
          BUILT_PAGES: '1'
      # Builds the site a second time and compares the checksum of every file.
      - run: npx vitest run site/src/contracts/determinism.test.ts
        env:
          BUILD_TWICE: '1'
      - run: npm run worker:types:check
      - run: npm run worker:dry-run -- "$RUNNER_TEMP/worker-out"

  accessibility:
    name: Accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The Chromium build is fixed by the exact playwright version in package.json.
      - run: npx playwright install --with-deps chromium
      # Proves every check fires on a page built to fail it, at desktop width and 390px, in light
      # and dark. The built site joins this job with Astro.
      - run: npm run a11y
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
        working-directory: pipeline
      # The same small dist, built from the pipeline's fixtures, feeds the site's tests and preview.
      - run: uv run --locked python tests/fixture_dist.py "$SURGERYWAITS_DIST"
        working-directory: pipeline
      - run: npm run build
      - run: npm run a11y -- site/dist / /404.html /hospital/armidale-hospital/
      # The preview build adds the figure and tile page, which the published build leaves out.
      - run: npm run build:preview
      - run: npm run a11y -- site/dist-preview /dev/primitives/
      - run: npx vitest run scripts/a11y.test.ts scripts/layout.test.ts
        env:
          A11Y_TEST: '1'

  pipeline:
    name: Pipeline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest --ignore=tests/test_repo.py --ignore=tests/test_docs.py --ignore=tests/test_testing_rules.py

  repository:
    name: Repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests/test_repo.py tests/test_docs.py tests/test_testing_rules.py

  data:
    name: Data checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    env:
      SURGERYWAITS_REQUIRE_DATA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      # The pull verifies every sha256, so a restored file is trusted only when its hash matches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.downloads
          key: pinned-data-${{ hashFiles('data/manifest.json') }}
      # Runs before pytest because the tests refuse the network.
      - run: uv run python -m surgerywaits.pull
      # The variable turns any skip without a planned: reason into a failure.
      - run: uv run --locked pytest -rs
      # The published site reads the real dist, so the site is built from it and its pages are checked.
      - run: uv run python -m surgerywaits.build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .
      - run: npm run build
        working-directory: .
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist
      - run: npx vitest run site/src/contracts/built-pages.test.ts site/src/contracts/sitemaps.test.ts site/src/contracts/redirects.test.ts
        working-directory: .
        env:
          BUILT_PAGES: '1'
          SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist
      - run: npx vitest run site/src/contracts/determinism.test.ts
        working-directory: .
        env:
          BUILD_TWICE: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
          SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist
