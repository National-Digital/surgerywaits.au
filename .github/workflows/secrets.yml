name: Secret scan

# Fails on a credential committed anywhere in the history, on any branch.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          VERSION=8.24.3
          SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --quiet
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner --exit-code 1 --log-opts=--all
      # A token made at run time, so no fake secret is committed, proves the scan still finds one.
      - name: gitleaks still finds a planted token
        run: |
          mkdir -p "$RUNNER_TEMP/planted"
          printf 'token = "ghp_%s"\n' "$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > "$RUNNER_TEMP/planted/config.txt"
          # Exit code 2 means leaks found, so a scan that errors out cannot pass as a find.
          rc=0
          ./gitleaks detect --no-git --source "$RUNNER_TEMP/planted" --config .gitleaks.toml --redact --no-banner --exit-code 2 || rc=$?
          [ "$rc" -eq 2 ] || { echo "::error::gitleaks did not report the planted token (exit $rc)"; exit 1; }
