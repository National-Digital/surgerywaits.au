name: Preview build

# Builds the site for a pull request from the pinned publicdata.au versions and uploads it as an
# artifact. It has no secrets and no environment, and it runs for pull requests from forks too.
# The preview deploy workflow publishes the artifact after this run finishes.
on:
  pull_request:
    branches: [main] # the cleanup workflow runs from the base branch, so a preview needs a base of main
    types: [opened, synchronize, reopened]

permissions: {}

# A newer push to the same pull request replaces the run in progress, since its build supersedes this one.
concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the preview site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SURGERYWAITS_DIST: ${{ github.workspace }}/pipeline/dist
      SURGERYWAITS_REQUIRE_DATA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pipeline/uv.toml
          enable-cache: false
      - run: uv sync --locked
        working-directory: pipeline
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The pull verifies every sha256 against data/manifest.json and fails on a mismatch.
      - run: uv run python -m surgerywaits.pull
        working-directory: pipeline
      - run: uv run python -m surgerywaits.build
        working-directory: pipeline
      - run: npm run build
      # CI runs the other gates on the pull request. These check the built pages against the real data.
      - run: npx vitest run site/src/contracts/built-pages.test.ts site/src/contracts/sitemaps.test.ts site/src/contracts/redirects.test.ts site/src/contracts/data-api.test.ts site/src/contracts/surfaces.test.ts site/src/contracts/json-ld.test.ts site/src/contracts/mcp-built.test.ts
        env:
          BUILT_PAGES: '1'
      # The deploy workflow serves this folder and sets the noindex header itself. Dot files are kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
