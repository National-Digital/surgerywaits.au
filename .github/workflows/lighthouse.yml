name: Lighthouse

# Started by hand. Runs a pinned Lighthouse in the runner's Chrome against an address and fails
# when a category scores below the minimum. It needs no secret. This workflow never runs on a
# schedule or on a pull request.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Address to measure
        type: string
        default: https://surgerywaits.au/
      preset:
        description: Device to emulate
        type: choice
        options: [mobile, desktop]
        default: mobile
      minimum:
        description: Lowest accepted score for each category, out of 100
        type: string
        default: '90'

permissions: {}

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  measure:
    name: Measure
    if: ${{ github.repository == 'National-Digital/surgerywaits.au' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LIGHTHOUSE_VERSION: 13.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run Lighthouse
        env:
          URL: ${{ inputs.url }}
          PRESET: ${{ inputs.preset }}
          MINIMUM: ${{ inputs.minimum }}
        run: |
          set -eu
          case "$URL" in http://*|https://*) ;; *) echo "::error::The address must start with http:// or https://"; exit 1 ;; esac
          case "$MINIMUM" in ''|*[!0-9]*) echo "::error::The minimum must be a whole number"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/lighthouse"
          preset=()
          [ "$PRESET" != desktop ] || preset=(--preset=desktop)
          CHROME_PATH="$(command -v google-chrome)" npx --yes "lighthouse@$LIGHTHOUSE_VERSION" "$URL" \
            --chrome-flags="--headless=new --no-sandbox" "${preset[@]}" \
            --output=json --output=html --output-path="$RUNNER_TEMP/lighthouse/report"
          jq -r '.categories | to_entries[] | "\(.value.title): \((.value.score // 0) * 100 | round)"' "$RUNNER_TEMP/lighthouse/report.report.json"
          below=$(jq -r --argjson min "$MINIMUM" '
            . as $r
            | $r.categories | to_entries[]
            | select(((.value.score // 0) * 100) < $min)
            | .key as $k
            | "\(.value.title) is below \($min)",
              ($r.categories[$k].auditRefs[]
                | select(.weight > 0)
                | $r.audits[.id]
                | select(.score != null and .score < 1)
                | "  - \(.title) (\(.id)): \(.score)")' "$RUNNER_TEMP/lighthouse/report.report.json")
          if [ -n "$below" ]; then
            printf '%s\n' "$below"
            echo "::error::A category is below the minimum"
            exit 1
          fi
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: ignore
          retention-days: 7
