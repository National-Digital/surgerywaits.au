name: Workflow lint

# zizmor and actionlint (with shellcheck) over every workflow, shellcheck over every shell file,
# then a check that both tools still fail a workflow with known defects.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor, actionlint and shellcheck
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          fetch() {
            curl -fsSL -o "$RUNNER_TEMP/$1" "$2"
            echo "$3  $RUNNER_TEMP/$1" | sha256sum -c -
          }
          fetch zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256"
          tar xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$bin" zizmor
          fetch actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          fetch shellcheck.tar.gz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" "$SHELLCHECK_SHA256"
          tar xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
      # The token lets zizmor's online audits check each pinned commit against its version comment.
      # --strict-collection fails on a workflow zizmor cannot parse instead of skipping it.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona auditor --strict-collection --format github .github
      - name: actionlint
        run: actionlint -shellcheck "$RUNNER_TEMP/lint-bin/shellcheck"
      # Hooks have no .sh suffix, so the file list names .githooks as well as *.sh.
      - name: Shell lint
        run: git ls-files -z -- '.githooks/*' '*.sh' | xargs -0 -r "$RUNNER_TEMP/lint-bin/shellcheck"
      # concurrency-limits is reported only at the pedantic persona and above, so finding it shows
      # a pedantic or stricter persona is in force.
      - name: Both tools still fail a workflow with known defects
        env:
          FIXTURE: .github/lint-fixtures/defects.yml
        run: |
          set +e
          zizmor --offline --persona auditor --format plain "$FIXTURE" > "$RUNNER_TEMP/zizmor.txt" 2>&1
          z=$?
          actionlint -shellcheck "$RUNNER_TEMP/lint-bin/shellcheck" "$FIXTURE" > "$RUNNER_TEMP/actionlint.txt" 2>&1
          a=$?
          set -e
          cat "$RUNNER_TEMP/zizmor.txt" "$RUNNER_TEMP/actionlint.txt"
          [ "$z" -ne 0 ] || { echo "::error::zizmor passed the defects fixture"; exit 1; }
          [ "$a" -ne 0 ] || { echo "::error::actionlint passed the defects fixture"; exit 1; }
          for rule in unpinned-uses template-injection artipacked concurrency-limits; do
            grep -q "\[$rule\]" "$RUNNER_TEMP/zizmor.txt" || { echo "::error::zizmor no longer reports $rule"; exit 1; }
          done
          grep -q 'github.event.pull_request.title" is potentially untrusted' "$RUNNER_TEMP/actionlint.txt" || { echo "::error::actionlint no longer reports the untrusted input"; exit 1; }
          grep -q SC2086 "$RUNNER_TEMP/actionlint.txt" || { echo "::error::actionlint no longer runs shellcheck"; exit 1; }
